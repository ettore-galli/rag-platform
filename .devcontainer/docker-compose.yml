services:

  dev:

    build:
      context: .
      dockerfile: Dockerfile
      target: python-dev-image

    env_file:
      - .env

    volumes:
      - ..:/workspace:cached

    command: sleep infinity

  ollama:

    image: ollama/ollama:latest

    env_file:
      - .env

    volumes:
      - ${EXTERNAL_MODEL_PATH}:/root/.ollama

    ports:
      - "11434:11434"

    restart: unless-stopped

volumes:
  ollama-data: