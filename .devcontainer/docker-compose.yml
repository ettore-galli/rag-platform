services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-dev-image

    env_file:
      - .env

    volumes:
      - ..:/workspace:cached

    command: sleep infinity

  ollama:
    image: ollama/ollama:latest

    env_file:
      - .env

    volumes:
      - ${EXTERNAL_MODEL_PATH}:/root/.ollama
      - ../ollama_model_files:/root/ollama_model_files

    ports:
      - "11434:11434"

    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_DB: ${RAG_VECTOR_DB_POSTGRES_DB}
      POSTGRES_USER: ${RAG_VECTOR_DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RAG_VECTOR_DB_POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - ${RAG_VECTOR_DB_POSTGRES_DATA_FOLDER}:/var/lib/postgresql/data

    restart: unless-stopped

 
